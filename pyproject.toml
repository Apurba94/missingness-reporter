[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "missingness-reporter"
version = "0.1.0"
description = "Report missing-data patterns per column and row with co-missingness summaries."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
missingness-reporter = "missingness_reporter.cli:main"

[tool.setuptools]
packages = ["missingness_reporter"]
